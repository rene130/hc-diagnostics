<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HC Diagnostics</title>
<meta name="theme-color" content="#0E1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#0E1013; --bg2:#2A2F35; --surface:#1F2328; --sunk:#16191C; --ink:#EEF0F2; --muted:#9BA3AC; --line:#333940;
  --accent:#EE5A0C; --accent-ink:#FFFFFF; --blue:#FF7A2E; --ok:#4CC27A; --warn:#FF7A1A; --bad:#FF4D4D;
  --c1:#FF6A1A; --c2:#B7BEC6; --c3:#4CC27A; --c4:#B98AF0; --ghost:#5E6670; --cold:#4DA3FF; --band:rgba(76,194,122,.12); --yel:#F2CC4D;
  --ico-bg:#121417; --ico-ink:#FF6A1A; --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
  --hdr1:#2A2F35; --hdr2:#141619; --hdr-ink:#F1F3F5; --hdr-muted:#A9B1BA; --hdr-line:#3B4148;
  --plate-bg:#FFFFFF; --plate-ink:#111111;
  --font:'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --cond:'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(130% 70% at 50% 0%,var(--bg2) 0%,var(--bg) 72%) fixed var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr1)}
button{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(180deg,var(--hdr1),var(--hdr2));color:var(--hdr-ink);box-shadow:inset 0 -3px 0 var(--accent),0 4px 16px rgba(0,0,0,.18)}
.top-row{display:flex;align-items:center;gap:12px;padding:0 14px;height:112px;max-width:760px;margin:0 auto;transition:height .2s}
.top.has-veh .top-row{height:70px}
.brand{flex:1;display:flex;align-items:center;min-width:0;border:0;background:none;padding:0;cursor:pointer}
.brand img{height:66px;width:auto;max-width:100%;display:block;object-fit:contain;object-position:left center}
@media (max-width:360px){.brand img{height:54px}}
.overlay.center{align-items:center;padding:20px;z-index:40}
.alertbox{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--bad);border-radius:18px;max-width:380px;width:100%;padding:26px 22px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .18s ease-out}
.alertbox h2{margin:8px 0 8px;font-size:26px}
.alertbox p{margin:0 0 20px;font-size:18px;line-height:1.4}
.al-ico{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.al-ico svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.92);opacity:0}}

.back{border:1px solid var(--hdr-line);background:rgba(255,255,255,.06);width:38px;height:38px;border-radius:50%;font:600 24px/1 var(--cond);color:var(--hdr-ink);cursor:pointer;display:none;place-items:center;padding:0 0 3px;flex:none}
.conn{border:1px solid var(--hdr-line);background:rgba(255,255,255,.06);color:var(--hdr-ink);border-radius:999px;padding:8px 13px;font:600 15px var(--cond);display:flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ghost);flex:none}
.dot.on{background:var(--ok)} .dot.sim{background:var(--accent)} .dot.busy{background:var(--warn)}
.dot.on{box-shadow:0 0 0 3px rgba(76,194,122,.28);animation:blink 1.1s infinite} .dot.sim{animation:blink 1.1s infinite}
.veh{display:flex;align-items:center;gap:10px;padding:0 14px;height:42px;max-width:760px;margin:0 auto;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--hdr-ink)}
.plate{display:inline-flex;align-items:center;font:700 17px/1 var(--cond);letter-spacing:.09em;padding:5px 8px 4px;background:var(--plate-bg);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:5px;flex:none}
.plate.empty{background:transparent;color:var(--hdr-muted);border:2px dashed var(--hdr-line);letter-spacing:.02em}
.veh-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.veh-sub{color:var(--hdr-muted);font-size:14px}
main{display:block}
.view{padding:18px 16px 140px;max-width:760px;margin:0 auto}
h1.vh{font:700 32px/1.05 var(--cond);margin:4px 0 8px}
h1.vh::after{content:"";display:block;width:46px;height:4px;border-radius:2px;background:var(--accent);margin-top:9px}
.kicker{font:600 13px var(--font);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
h2{font:700 22px/1.15 var(--cond);margin:22px 0 8px}
h3{font:600 18px/1.2 var(--cond);margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiles{display:grid;gap:12px;margin-top:6px}
@media (min-width:640px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;width:100%;min-height:98px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.99)}
.tile .ico{width:60px;height:60px;border-radius:50%;background:var(--ico-bg);color:var(--ico-ink);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 2px 8px rgba(0,0,0,.25)}
.tile .ico.alt{background:var(--ico-bg);color:var(--ico-ink)}
.tile svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile h3{font-size:23px;margin:0}
.tile p{margin:2px 0 0;color:var(--muted);font-size:15px;line-height:1.3}
.tile .tag{font:600 14px var(--cond);color:var(--blue)}
.histlink{margin-top:14px;width:100%}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 17px/1 var(--cond);letter-spacing:.01em;min-height:48px;padding:0 18px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--ico-bg);border-color:var(--ico-bg);color:#F1F3F5}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.big{width:100%;min-height:58px;font-size:21px}
.btn.sm{min-height:38px;font-size:15px;padding:0 12px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:is(.btn,.tile,.conn,.veh,input,select,textarea,.chip):focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{background:var(--sunk)}
.field{margin:0 0 12px}
.field label{display:block;font:600 15px var(--cond);margin:0 0 5px;color:var(--muted)}
input,select,textarea{width:100%;font:16px var(--font);padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctx{position:relative}
.mic{position:absolute;right:8px;bottom:10px;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(196,43,43,.18)}}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;border-radius:8px;font:600 16px var(--cond);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:600 15px var(--cond);cursor:pointer}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.no{border-color:var(--warn);color:var(--warn)}
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.st{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.st.run{border-color:var(--warn);border-top-color:transparent;animation:spin .8s linear infinite}
.st.ok{background:var(--ok);border-color:var(--ok)} .st.err{background:var(--bad);border-color:var(--bad)}
@keyframes spin{to{transform:rotate(360deg)}}
.mil{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;margin:12px 0;border:1px solid var(--line);background:var(--surface)}
.mil .lamp{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--ghost)}
.mil.on .lamp{background:var(--warn);color:#fff}
.mil .lamp svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2}
.mod{margin:10px 0}
.code{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.code b{font:700 22px var(--cond);letter-spacing:.03em;min-width:78px}
.code.sev-r,.code.sev-o,.code.sev-y,.code.sev-n{border-left:6px solid var(--ghost);padding-left:10px;margin-left:-14px;align-items:flex-start}
.code.sev-r{border-left-color:var(--bad)} .code.sev-o{border-left-color:var(--warn)} .code.sev-y{border-left-color:var(--yel)}
.code .ci{flex:1;min-width:0} .code .ct{font-weight:600;line-height:1.25}
[data-dtc]{cursor:pointer;position:relative} [data-dtc]::after{content:"›";position:absolute;right:2px;top:50%;transform:translateY(-50%);font:600 26px var(--cond);color:var(--muted)} [data-dtc] .ci{padding-right:18px}
[data-dtc]:active{background:var(--sunk)}
.sevl{font:700 13px var(--cond)} .sevl.r{color:var(--bad)} .sevl.o{color:var(--warn)} .sevl.y{color:var(--yel)}
.sevleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:6px 0 4px}
.sevleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sevleg.mini{font-size:12px;gap:4px 12px;margin:-4px 2px 14px;opacity:.75}
.sevleg.mini i{width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.kind{font:600 14px var(--cond);padding:1px 9px;border-radius:999px;background:transparent;border:1.5px solid var(--line);letter-spacing:.02em}
.kind.almacenados{color:var(--warn);border-color:var(--warn)} .kind.pendientes{color:var(--yel);border-color:var(--yel)} .kind.permanentes{color:var(--bad);border-color:var(--bad)}
.code .cc{display:flex;flex-direction:column;width:96px;flex:none}
.code .cc .sevl{font-size:14px;margin-top:1px}
.steps .sv{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;white-space:nowrap;padding-left:10px;font-size:15px}
.steps li{white-space:nowrap} @media (max-width:380px){.steps .sv{font-size:13px}}
.modcount{color:var(--accent);font-weight:700;margin-left:auto}
.card.mod>h3{display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 14px var(--cond);color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.ai{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);margin:12px 0}
.ai-row{display:flex;align-items:center;gap:10px;min-width:0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
.ai-t{color:var(--muted);font-variant-numeric:tabular-nums}
.err{padding:12px 14px;border-radius:10px;border:1px solid var(--bad);color:var(--bad);margin:12px 0;background:var(--surface)}
.note{padding:12px 14px;border-radius:10px;border-left:4px solid var(--accent);background:var(--surface);margin:12px 0}
/* report */
.rep-head{border-radius:14px;padding:16px;margin:14px 0;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--ghost)}
.rep-head.baja{border-top-color:var(--ok)} .rep-head.media{border-top-color:var(--warn)} .rep-head.alta{border-top-color:var(--bad)}
.rep-head .sev{font:600 15px var(--cond);color:var(--muted)}
.rep-head h2{font-size:27px;margin:4px 0 10px}
.conf{display:flex;align-items:center;gap:10px;margin:8px 0 12px}
.conf .bar{flex:1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.conf .bar i{display:block;height:100%;background:var(--blue)}
.conf b{font:700 20px var(--cond);min-width:52px;text-align:right}
.verdict{display:flex;gap:12px;align-items:center}
.verdict .vi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 26px var(--cond);color:#fff;flex:none;background:var(--ghost)}
.verdict.solucionado .vi{background:var(--ok)} .verdict.parcial .vi{background:var(--warn)} .verdict.sin .vi,.verdict.empeoro .vi{background:var(--bad)}
.ev{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.sd{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--ghost)}
.sd.ok{background:var(--ok)} .sd.alerta{background:var(--warn)} .sd.falla{background:var(--bad)}
.cause{margin:10px 0}
.cause .cb{height:8px;border-radius:4px;background:var(--sunk);margin:5px 0 4px;overflow:hidden}
.cause .cb i{display:block;height:100%;background:var(--c2)}
.cause-top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
ol.proc{padding-left:22px;margin:6px 0}
ol.proc li{margin:0 0 10px}
ul.plain{padding-left:20px;margin:6px 0}
ul.plain li{margin:0 0 6px}
figure.chart{margin:12px 0;padding:12px 10px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
figure.chart figcaption{font:600 17px var(--cond);margin:0 4px 6px;display:flex;justify-content:space-between;gap:8px}
figure.chart figcaption span{color:var(--muted);font-weight:500}
figure.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:4px 6px 0}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ax{font:12px var(--font);fill:var(--muted)}
.grid-l{stroke:var(--line);stroke-width:1}
/* live */
.live-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}
.rec-ind{display:flex;align-items:center;gap:8px;font:700 22px var(--cond);font-variant-numeric:tabular-nums}
.rec-ind .rd{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.tilesL{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:700px){.tilesL{grid-template-columns:repeat(3,1fr);gap:12px}.lt{padding:14px 14px 10px}.lt .n{font-size:15px}.lt .v{font-size:44px}.lt svg{height:48px}}
@media (min-width:1100px){.tilesL{grid-template-columns:repeat(4,1fr)}}
.lt{border-width:2px}
.lt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px 6px;min-width:0}
.lt .n{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .v{font:700 28px/1.05 var(--cond);font-variant-numeric:tabular-nums}
.lt .v small{font:500 14px var(--font);color:var(--muted);margin-left:3px}
tr.g1 td.num{color:var(--yel);font-weight:700} tr.g2 td.num{color:var(--warn);font-weight:700} tr.g3 td.num{color:var(--bad);font-weight:700} tr.gc td.num{color:var(--cold);font-weight:700}
details.fz>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer} details.fz>summary::-webkit-details-marker{display:none}
details.fz>summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.fz[open]>summary::after{transform:rotate(-135deg)}
details.fz{padding:12px 14px} details.fz>summary h3{margin:0}
.pkq{margin-top:10px;display:block;width:100%;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.pkl{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--surface)}
.pki{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pki:last-child{border-bottom:0}
.pki input{width:22px;height:22px;padding:0;margin:0;flex:none;accent-color:var(--blue)}
.pki .pn{flex:1;min-width:0} .pki .pu{color:var(--muted);font-size:14px}
.pki.hide{display:none}
.pke{padding:16px 12px;color:var(--muted);text-align:center}
.rx,.rx p,.rx li,.rx div,.rx span,.rx b{font-size:15.5px;line-height:1.45}
.rx b{font-weight:600}
.rx-p{margin:0 0 12px}
.rx-lbl{display:flex;align-items:center;gap:8px;font-weight:600;margin:4px 0 8px;color:var(--muted)}
.rx-lbl svg,.ii svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--sunk);border:1px solid var(--line)}
.ii{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--blue);margin-top:1px}
.irow{display:flex;gap:9px;align-items:flex-start;margin-top:8px}
.rk,.tl,.ck,.evl{list-style:none;margin:0;padding:0}
.rk>li{padding:12px 0;border-top:1px solid var(--line)} .rk>li:first-child{border-top:0;padding-top:2px}
.rk-h{display:flex;align-items:center;gap:10px}
.rk-n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--blue);color:var(--blue)}
.rk-n.hi{background:var(--blue);color:#fff} .rk-n.lo{border-color:var(--ghost);color:var(--muted)}
.rk-t{flex:1;font-weight:600}
.pill{flex:none;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.hi{background:var(--blue);border-color:var(--blue);color:#fff}
.rk-b{height:6px;border-radius:3px;background:var(--sunk);margin:9px 0 2px 38px;overflow:hidden}

.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--blue)}
.msg.sys{align-self:center;color:var(--muted);font-size:13px;padding:2px}
.cond{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.cond:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff;font-weight:700}
.cond.done .box{background:var(--ok);border-color:var(--ok)}
.cond.done .ct{color:var(--muted);text-decoration:line-through}
.cond .box{font:700 14px var(--cond);color:var(--muted)} .cond.done .box{color:#fff}
.cond.cur{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding-left:8px;padding-right:8px}
.cond.cur .box{border-color:var(--accent);color:var(--accent)}
.big-num{font:700 64px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:center}
.big-lbl{text-align:center;color:var(--muted);margin-top:4px}
.peaks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.peak{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.peak b{display:block;font:700 30px/1.1 var(--cond)}
.peak span{color:var(--muted);font-size:14px}
.dl-up2{color:#2FD36B!important;font-weight:800} .dl-up1{color:#8FE3AE!important} .dl-dn1{color:#FF9C9C!important} .dl-dn2{color:#FF3B3B!important;font-weight:800}
.dyt2 td,.dyt2 td.num{font-size:15px;padding:7px 5px} .dyt2 th{padding:6px 5px;font-size:12px} .dyt2 td.mut{color:var(--muted);font-weight:600}
.delta-up{color:var(--ok)} .delta-dn{color:var(--bad)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:10px 0}
.fthumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--sunk);display:grid;place-items:center;font:600 14px var(--cond);color:var(--muted);text-align:center;padding:4px}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fthumb button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:var(--surface)}
.drop input{display:none}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:8px 0;cursor:pointer;width:100%;text-align:left}
.list-item .grow{flex:1;min-width:0}
.badge{font:600 13px var(--cond);padding:3px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin-top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:30;font-weight:500;max-width:90vw}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ===== Versión taller (GitHub Pages): reemplaza las capacidades de claude.ai ===== */
(function(){
  const DBN='hcdiag',ST='docs';let mem={};
  function open(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  const dbp=(async()=>{try{const d=await open();await new Promise(res=>{const rq=d.transaction(ST,'readonly').objectStore(ST).openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){const k=String(c.key);const i=k.indexOf('/');const col=k.slice(0,i),id=k.slice(i+1);(mem[col]=mem[col]||{})[id]=c.value;c.continue()}else res()};rq.onerror=()=>res()});return d}catch(e){return null}})();
  function put(col,id,val){dbp.then(d=>{if(!d)return;try{const os=d.transaction(ST,'readwrite').objectStore(ST);val===undefined?os.delete(col+'/'+id):os.put(val,col+'/'+id)}catch(e){}})}
  const subs={};const notify=col=>(subs[col]||[]).forEach(f=>{try{f()}catch(e){}});
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  const snap=a=>({docs:a.map(([id,v])=>({id,exists:true,data:()=>clone(v)})),size:a.length,empty:!a.length});
  const newId=()=>'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function q(col,st){return{
    where(f,op,v){return q(col,{...st,w:[...(st.w||[]),[f,op,v]]})},
    orderBy(f,dir){return q(col,{...st,o:[f,dir||'asc']})},
    limit(n){return q(col,{...st,l:n})},
    _run(){let a=Object.entries(mem[col]||{});(st.w||[]).forEach(([f,op,v])=>{a=a.filter(([,d])=>op==='=='?d&&d[f]===v:op==='!='?d&&d[f]!==v:true)});
      if(st.o){const[f,dir]=st.o;a.sort((x,y)=>{const p=x[1][f],r=y[1][f];const c=p<r?-1:p>r?1:0;return dir==='desc'?-c:c})}
      if(st.l)a=a.slice(0,st.l);return snap(a)},
    async get(){return this._run()},
    onSnapshot(cb){const f=()=>cb(this._run());(subs[col]=subs[col]||[]).push(f);setTimeout(f,0);return()=>{subs[col]=(subs[col]||[]).filter(x=>x!==f)}},
    doc(id){id=id||newId();const C=()=>(mem[col]=mem[col]||{});return{id,
      async get(){const v=C()[id];return{id,exists:v!==undefined,data:()=>clone(v)}},
      async set(d){C()[id]=clone(d);put(col,id,C()[id]);notify(col)},
      async update(d){C()[id]={...(C()[id]||{}),...clone(d)};put(col,id,C()[id]);notify(col)},
      async delete(){delete C()[id];put(col,id,undefined);notify(col)}}},
    async add(d){const r=this.doc();await r.set(d);return r}
  }}
  const DB={collection:c=>q(c,{})};
  async function save(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name||'informe.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
  window.__hcSave=save;
  window.claude={use:async n=>{if(n==='db'){await dbp;return DB}if(n==='downloads')return{save:async({filename,data})=>save(data,filename)};return null}};
})();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>

async function askJSON(prompt,{tier='default',el,label='Claude está analizando los datos',images,cache}={}){
  if(!sampleFn) throw {code:'unavailable'};
  const ctl=new AbortController();const t0=Date.now();
  el.innerHTML=`<div class="ai"><div class="ai-row"><span class="spin"></span><span class="ai-l">${esc(label)}</span></div><span class="ai-t">0 s</span><button class="btn sm" data-stop>Detener</button></div>`;
  const tEl=$('.ai-t',el),lEl=$('.ai-l',el);
  const tm=setInterval(()=>{tEl.textContent=Math.round((Date.now()-t0)/1000)+' s'},1000);
  $('[data-stop]',el).onclick=()=>ctl.abort();
  try{
    const opts={modelTier:tier,signal:ctl.signal,onText:()=>{lEl.textContent='Redactando el informe…'}};
    if(images&&images.length) opts.images=images;

}

/* Voz: elige la voz en español más natural del equipo (las «mejoradas», «premium», «neural» o de Google suenan mucho más humanas) */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang))}catch(e){VOICES=[]}}
if(window.speechSynthesis){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function voiceScore(v){const n=norm(v.name);let s=0;
  if(/premium|enhanced|mejorad|neural|natural|siri/.test(n))s+=40;if(/google/.test(n))s+=22;if(/microsoft.*online/.test(n))s+=30;
  if(/^es[-_](cl)/i.test(v.lang))s+=12;else if(/^es[-_](419|us|mx|ar|co)/i.test(v.lang))s+=9;else if(/^es[-_]es/i.test(v.lang))s+=5;
  if(/compact|eloquence|espeak|grandma|grandpa|reed|rocko|shelley|sandy|eddy|flo/.test(n))s-=40;if(v.localService===false)s+=3;return s}
function bestVoice(){if(!VOICES.length)loadVoices();const pick=store.get('voz');if(pick==='__sys')return null;if(pick){const v=VOICES.find(x=>x.name===pick);if(v)return v}return VOICES.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null}
function humanize(t){return String(t).replace(/\b(la |La )?ECU\b/g,'la computadora').replace(/\bSTFT\b/g,'corrección corta').replace(/\bLTFT\b/g,'corrección larga').replace(/\bMAF\b/g,'sensor de flujo de aire').replace(/\bMAP\b/g,'sensor de presión').replace(/\bTPS\b/g,'mariposa').replace(/(\d)\.(\d{3})/g,'$1$2').replace(/\s*·\s*/g,', ')}
function speak(t,force){if((!ttsOn&&!force)||!window.speechSynthesis)return;try{speechSynthesis.cancel();
  const parts=(humanize(t).match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(Boolean);const v=bestVoice();
  const sys=store.get('voz')==='__sys';parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p);if(v){u.voice=v;u.lang=v.lang}else u.lang=sys?(store.get('vozlang')||'es-MX'):'es-CL';u.rate=0.98;u.pitch=1.02;u.volume=1;speechSynthesis.speak(u)})}catch(e){}}

let SR_BLOCKED=false;
const SR_MSG={'not-allowed':'El navegador no dio permiso al micrófono en esta vista.','service-not-allowed':'El reconocimiento de voz no está disponible en esta vista.','audio-capture':'No se encontró un micrófono.','network':'El reconocimiento de voz necesita conexión a internet.','no-speech':'No se escuchó nada. Intenta de nuevo, hablando cerca del teléfono.','timeout':'El micrófono de la app no respondió en esta vista.','blocked':'El micrófono de la app no está disponible en esta vista.'};
function listen({onText,onEnd,onFail}){
  if(!SR||SR_BLOCKED){onFail&&onFail('blocked');return null}
  const r=new SR();r.lang='es-CL';r.interimResults=true;r.continuous=true;let final='',started=false,failed=false;
  r.onstart=()=>{started=true};
  r.onresult=e=>{started=true;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t+' ';else interim+=t}onText&&onText(final,interim)};
  r.onerror=e=>{failed=true;if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error))SR_BLOCKED=true;if(e.error!=='aborted')onFail&&onFail(e.error)};
  r.onend=()=>onEnd&&onEnd(final.trim());
  try{r.start()}catch(e){SR_BLOCKED=true;onFail&&onFail('blocked');return null}
  setTimeout(()=>{if(!started&&!failed){failed=true;SR_BLOCKED=true;try{r.abort()}catch(_){}onFail&&onFail('timeout')}},2500);
  return r;
}
function micField(id,placeholder,value=''){
  return `<div class="ctx"><textarea id="${id}" placeholder="${esc(placeholder)}">${esc(value)}</textarea><button class="mic" type="button" data-mic="${id}" aria-label="Dictar">${ICON.mic}</button></div><div class="mic-hint" id="${id}Hint"></div>`;
}
function micFallback(id,code){
  const ta=$('#'+id),h=$('#'+id+'Hint');
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
  if(h)h.innerHTML=`<div class="note" style="margin:8px 0 0"><b>${esc(SR_MSG[code]||SR_MSG.blocked)}</b> Puedes dictar igual: toca el cuadro de texto y usa el <b>micrófono del teclado</b> ${isIOS?'(abajo a la derecha del teclado del iPhone)':'(en el teclado de Android, el ícono 🎤 arriba o a la derecha)'}. Al terminar, toca Enviar.</div>`;
  if(ta){ta.focus();try{ta.setSelectionRange(ta.value.length,ta.value.length)}catch(e){}}
}
function bindMics(root=app){
  $$('[data-mic]',root).forEach(b=>{let rec=null,base='';b.onclick=()=>{const id=b.dataset.mic,ta=$('#'+id);if(rec){rec.stop();return}
    if(!SR||SR_BLOCKED){micFallback(id,'blocked');return}
    base=ta.value?ta.value.trim()+' ':'';
    rec=listen({onText:(f,i)=>{ta.value=base+f+i},onEnd:f=>{ta.value=(base+f).trim();rec=null;b.classList.remove('rec')},onFail:c=>{rec=null;b.classList.remove('rec');if(c==='no-speech')toast(SR_MSG['no-speech']);else micFallback(id,c)}});
    if(rec){b.classList.add('rec');const h=$('#'+id+'Hint');if(h)h.innerHTML=''}}});
}

}

  if(backGuard&&!backGuard())return;
  if(viewCleanup){try{viewCleanup()}catch(e){}viewCleanup=null}
  S.view=v;window.scrollTo(0,0);$('#back').style.display=v==='home'?'none':'grid';
  $('#back').setAttribute('aria-label',PARENT[v]?'Volver a Diagnóstico OBD2':'Volver al inicio');$('#back').title=PARENT[v]?'Diagnóstico OBD2':'Inicio';

}

function viewClear(){
  app.innerHTML=`<section class="view"><h1 class="vh">Borrar códigos de error</h1>
   <p class="lead">Motor apagado y contacto en ON. Primero se leen los códigos para que quede registro de lo que se borra.</p>
   <button class="btn primary big" id="clrRead">Leer códigos actuales</button><div id="clrBox"></div></section>`;
  $('#clrRead').onclick=()=>ensure(true,clearFlow);

async function clearFlow(){
  const box=$('#clrBox'),b=$('#clrRead');b.disabled=true;
  box.innerHTML='<div class="ai"><div class="ai-row"><span class="spin"></span>Leyendo códigos…</div></div>';
  let d={};try{d=await readDtcs()}catch(e){}
  const list=Object.entries(d).flatMap(([m,x])=>['almacenados','pendientes','permanentes'].flatMap(k=>x[k].map(c=>({c,m,k}))));
  b.disabled=false;b.textContent='Volver a leer';
  if(!list.length){box.innerHTML='<div class="card flat">No hay códigos para borrar.</div>';return}
  list.sort((a,b)=>sevRank(a.c)-sevRank(b.c));enrichCodes(list.map(x=>x.c));
  box.innerHTML=`${sevLegend()}<div class="card">${list.map(x=>codeRow(x.c,x.k,x.m)).join('')}</div>
   <p class="small muted">Los permanentes no se borran con este comando: desaparecen solos cuando la ECU confirma que la falla ya no está.</p>
   <button class="btn danger big" id="clrGo">Borrar códigos</button>`;
  $('#clrGo').onclick=async()=>{
    const ok=await confirmSheet('¿Borrar los códigos?','Se borran los códigos, los datos congelados y los monitores de emisiones (quedarán incompletos hasta manejar un rato). Borrar no repara la falla: si persiste, el código volverá.','Borrar códigos',true);
    if(!ok)return;const g=$('#clrGo');g.disabled=true;g.textContent='Borrando…';
    let done=false;try{done=await clearDtcs()}catch(e){}
    await sleep(800);let d2={};try{d2=await readDtcs()}catch(e){}
    const left=Object.values(d2).flatMap(x=>[...x.almacenados,...x.pendientes]);
    box.innerHTML=left.length?`<div class="err">Quedaron códigos activos: ${esc(left.join(', '))}. La falla sigue presente o el módulo no aceptó el borrado.</div>`:`<div class="note"><b>Códigos borrados.</b> ${done?'El módulo confirmó el borrado. ':''}Se borraron: ${esc(list.filter(x=>x.k!=='permanentes').map(x=>x.c).join(', '))}.</div>`;
    if(S.vehicle)saveSession({tipo:'codigos',titulo:'Códigos borrados: '+list.map(x=>x.c).join(', '),contexto:'',informe:null,datos:{borrados:list,restantes:left}});
  };
}

/* Suaviza la serie para dibujar líneas lisas en vez de escalones:
   1) junta los tramos de valores repetidos (escalones por resolución del sensor) en un solo punto al centro del tramo,
      salvo tramos largos (>1 s), que conservan su inicio y fin para no inventar rampas;
   2) promedio móvil por tiempo (±0,35 s) con peso triangular;
   3) como máximo ~260 puntos. Las sondas O2 solo pasan por el paso 1 para no ocultar su oscilación. */
function smoothSer(pts,p){

  let ms=Infinity;for(let k=1;k<runs.length;k++){const d=Math.abs(runs[k][2]-runs[k-1][2]);if(d>0&&d<ms)ms=d}
  const c=[];runs.forEach((r,k)=>{const jp=k>0?Math.abs(r[2]-runs[k-1][2]):0,jn=k<runs.length-1?Math.abs(runs[k+1][2]-r[2]):0;
    const big=r[1]-r[0]>1&&(jp>1.5*ms||jn>1.5*ms);if(big){c.push([r[0],r[2]]);c.push([r[1],r[2]])}else c.push([(r[0]+r[1])/2,r[2]])});

function enableSwipe(root,onDeleted){
  const FULL=96;
  $$('.swipe',root).forEach(w=>{
    const fg=$('.sw-fg',w),bg=$('.sw-bg',w);let x0=null,y0=0,dx=0,drag=false,moved=false,pid=null;
    const set=(v,anim)=>{fg.style.transition=anim?'transform .2s ease':'none';fg.style.transform=`translateX(${v}px)`;const k=Math.min(1,-v/FULL);bg.style.opacity=k;bg.classList.toggle('ready',k>=1)};
    fg.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;dx=0;drag=false;moved=false;pid=e.pointerId});
    fg.addEventListener('pointermove',e=>{if(x0==null||e.pointerId!==pid)return;const ddx=e.clientX-x0,ddy=e.clientY-y0;
      if(!drag){if(Math.abs(ddx)>8&&Math.abs(ddx)>Math.abs(ddy)){drag=true;moved=true;try{fg.setPointerCapture(pid)}catch(_){}}else if(Math.abs(ddy)>8){x0=null;return}else return}
      dx=Math.max(-FULL-30,Math.min(0,ddx));set(dx,false);e.preventDefault()});
    const end=async()=>{if(x0==null)return;x0=null;if(!drag)return;drag=false;
      if(dx<=-FULL){set(-w.offsetWidth,true);w.style.transition='height .22s ease,opacity .22s ease,margin .22s ease';w.style.height=w.offsetHeight+'px';
        try{await deleteSession(w.dataset.sw);requestAnimationFrame(()=>{w.style.height='0px';w.style.opacity='0';w.style.marginTop='0';w.style.marginBottom='0'});setTimeout(()=>{const g=w.closest('.hgrp');w.remove();if(g){const n=g.querySelectorAll('.swipe').length;const b=g.querySelector('.rsub');if(b)b.textContent=n;if(!n&&!g.querySelector('.hg-empty')){const pe=document.createElement('p');pe.className='muted hg-empty';pe.style.margin='0';pe.textContent='Sin registros.';g.appendChild(pe)}}if(window.H&&H.all)H.all=H.all.filter(x=>x.id!==w.dataset.sw);onDeleted&&onDeleted(w.dataset.sw)},240);toast('Eliminado del historial.')}
        catch(err){set(0,true);toast('No se pudo eliminar. Puede que no tengas permiso para borrar este registro.')}}
      else set(0,true)};
    fg.addEventListener('pointerup',end);fg.addEventListener('pointercancel',()=>{x0=null;if(drag){drag=false;set(0,true)}});
    fg.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  });
}

async function pdfToImages(file,max){
  if(!window.pdfjsLib)return[];
  try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  for(let i=1;i<=Math.min(pdf.numPages,max);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)))}
  return out;
}
function parseCsv(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<3)return null;
  const d=[';','\t',','].find(x=>lines[0].split(x).length>1)||',';
  const head=lines[0].split(d).map(s=>s.trim().replace(/^"|"$/g,''));const rows=lines.slice(1).map(l=>l.split(d).map(s=>s.trim().replace(/^"|"$/g,'').replace(',','.')));
  const cols=head.map((h,i)=>({h,vals:rows.map(r=>parseFloat(r[i]))})).filter(c=>c.vals.filter(isFinite).length>rows.length*0.7);
  if(!cols.length)return null;
  const tcol=cols.find(c=>/time|tiempo|^t$|seg/i.test(c.h));
  const series=cols.filter(c=>c!==tcol).slice(0,12).map(c=>({h:c.h,pts:c.vals.map((v,i)=>[tcol?tcol.vals[i]:i,v]).filter(p=>isFinite(p[0])&&isFinite(p[1]))}));
  return {series,rows:rows.length};
}

   <div id="hAll"><p class="muted">Cargando…</p></div>
   <details class="card cardd rsec"><summary><h2 class="cardh">Vehículos<span class="rsub" id="hVc">${S.vehicles.length}</span><span class="chev"></span></h2></summary><div id="hVehL"></div></details></section>`;
  H.all=await loadAllSessions();window.SAVED_LIST=[...(window.SAVED_LIST||[]),...H.all.filter(x=>x.tipo==='ruta')];
  const draw=()=>{const q=slug(H.q);const vm=v=>!q||slug([v.patente,v.marca,v.modelo,v.anio,v.vin].join(' ')).includes(q);
    const ss=H.all.filter(x=>!q||slug(vehName(x)+' '+(x.titulo||'')+' '+((S.vehicles.find(v=>v.id===x.vehiculoId)||{}).patente||'')).includes(q));
    const el=$('#hAll');if(!el)return;el.innerHTML=histGroups(ss,true);
    $$('[data-hs]',el).forEach(b=>b.onclick=()=>showSession(H.all.find(x=>x.id===b.dataset.hs)));enableSwipe(el,id=>{H.all=H.all.filter(x=>x.id!==id)});
    const vl=S.vehicles.filter(vm);$('#hVc').textContent=vl.length;
    $('#hVehL').innerHTML=vl.length?vl.map(v=>`<button class="list-item" data-hv="${esc(v.id)}"><span class="plate">${esc(v.patente||'S/P')}</span><span class="grow"><b>${esc([v.marca,v.modelo,v.anio].filter(Boolean).join(' ')||'Vehículo')}</b><div class="small muted">${esc(v.vin||'')}</div></span></button>`).join(''):'<p class="muted" style="margin:0">Sin vehículos.</p>';
    $$('[data-hv]').forEach(b=>b.onclick=()=>{H.veh=S.vehicles.find(v=>v.id===b.dataset.hv);historyVehicle()})};
  draw();
  $('#hq').oninput=e=>{H.q=e.target.value;draw()};
}
async function historyVehicle(){
  const v=H.veh;
  app.innerHTML=`<section class="view"><button class="btn sm" id="hb">‹ Todos los vehículos</button>
   <div class="row" style="margin:14px 0 4px;flex-wrap:nowrap"><span class="plate">${esc(v.patente||'S/P')}</span><h1 class="vh" style="margin:0">${esc([v.marca,v.modelo,v.anio].filter(Boolean).join(' '))}</h1></div>
   <p class="muted small">${esc([v.cc?v.cc+' cc':'',v.comb,v.vin?'VIN '+v.vin:''].filter(Boolean).join(', '))}</p>
   <div class="row"><button class="btn primary" id="huse">Usar este vehículo</button><button class="btn" id="hed">Editar datos</button></div>
   <h2>Pruebas e informes</h2><div id="hs"><p class="muted">Cargando…</p></div></section>`;
  $('#hb').onclick=()=>{H.veh=null;viewHistory()};
  $('#huse').onclick=()=>{S.vehicle=v;store.set('veh',v.id);renderVeh();toast('Vehículo seleccionado.');go('home')};
  $('#hed').onclick=()=>{S.vehicle=v;renderVeh();openVehicleSheet(()=>{H.veh=S.vehicle;historyVehicle()},true)};
  const list=await loadSessions(v.id);
  $('#hs').innerHTML=list.length?'<p class="small muted" style="margin:0 0 6px">Desliza un ítem a la izquierda para eliminarlo.</p>'+histGroups(list,false):'<div class="card flat">Este vehículo aún no tiene pruebas guardadas.</div>';
  $$('[data-hs]').forEach(b=>b.onclick=()=>showSession(list.find(x=>x.id===b.dataset.hs)));
  enableSwipe($('#hs'));
}
function showSession(s){
  let body='';
  if(s.tipo==='codigos')body=renderDiag(s.informe);
  else if(s.tipo==='ruta'){window.SAVED_LIST=[...(window.SAVED_LIST||[]).filter(x=>x.id!==s.id),s];const res={data:s.datos.series,events:s.datos.events||[],pids:s.datos.pids||[]};const ch=misfireBlock(s.datos.misfire)+routeCharts(res,null,s.informe&&s.informe.graficos);window.__hs=s;body=(s.modo!=='verificacion'&&s.datos&&s.datos.series?'<button class="btn primary big" data-cmphist="1" style="width:100%;margin:12px 0 4px">Nueva prueba en ruta comparativa</button><p class="small muted" style="margin:0 0 6px">Para salir a probar después de la reparación y comparar con esta prueba.</p>':'')+(s.informe?reportBtns(s.id):'')+(s.modo==='verificacion'?renderCompare(s.informe,ch):renderDiag(s.informe,ch))}
  else if(s.tipo==='launch'){const ch=s.datos&&s.datos.csv?Object.entries(s.datos.csv).map(([k,p])=>chartBlock(k,'',{series:[{pts:p,color:'var(--c1)'}],h:160})).join(''):'';body=s.modo==='verificacion'?renderCompare(s.informe,ch):renderDiag(s.informe,ch)}
  else if(s.tipo==='mecanica'){body=(s.datos.chat||[]).map(m=>m.role==='user'?`<div class="msg me" style="margin:10px 0 10px auto">${esc(m.text)}</div>`:mechCard(m.data)).join('')}
  else if(s.tipo==='vivo'){body=(s.datos.pids||[]).filter(p=>s.datos.series[p]&&s.datos.series[p].length).map(p=>chartBlock(pname(p),PIDS[p]?PIDS[p].u:'',{series:[{pts:s.datos.series[p],color:'var(--c1)'}],band:PIDS[p]&&PIDS[p].band,xLabel:'s',h:170})).join('')}
  else if(s.tipo==='dino'){const save=DY.cfg;DY.cfg=s.datos.cfg;body=dynoBlock({bins:s.datos.bins,pk:s.datos.pk});DY.cfg=save}
  app.innerHTML=`<section class="view"><button class="btn sm" id="sb">‹ Volver</button><p class="small muted" style="margin:12px 0 0">${esc(TIPO[s.tipo]||'')}, ${fdate(s.fecha)}</p>${s.contexto?`<div class="note"><b>Contexto:</b> ${esc(s.contexto)}</div>`:''}${body}</section>`;
  $('#sb').onclick=()=>{if(H.veh)historyVehicle();else viewHistory()};window.scrollTo(0,0);
}

/* ============================ inicio ============================ */
renderVeh();setConn();
const startView=(location.hash||'').slice(1);
go(['live','mecanica','diagnostico','codigos','borrar','ruta','launch','dino','historial'].includes(startView)?startView:'home');
</script>
